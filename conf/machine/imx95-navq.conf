# MR-NAVQ95 machine configuration file

MACHINE = "imx95-navq"
MACHINEOVERRIDES =. "mx95:"

require conf/machine/include/imx95-evk.inc

MACHINE_FEATURES:append:use-nxp-bsp = " nxp9098-pcie"
KERNEL_DEVICETREE_BASENAME = "imx95-navqb"

KERNEL_DEVICETREE:append:use-nxp-bsp = " \
       freescale/${KERNEL_DEVICETREE_BASENAME}.dtb \
       freescale/${KERNEL_DEVICETREE_BASENAME}-sja1110a.dtbo \
       freescale/${KERNEL_DEVICETREE_BASENAME}-sfp.dtb \
       freescale/${KERNEL_DEVICETREE_BASENAME}-csi_b2b-imx219.dtbo \
       freescale/${KERNEL_DEVICETREE_BASENAME}-csi_b2b-imx477.dtbo \
       freescale/${KERNEL_DEVICETREE_BASENAME}-csi_b2b-imx708.dtbo \
       freescale/${KERNEL_DEVICETREE_BASENAME}-csi_b2b-os08a20.dtbo \
       freescale/${KERNEL_DEVICETREE_BASENAME}-dsicsi_b2b-imx219.dtbo \
       freescale/${KERNEL_DEVICETREE_BASENAME}-dsicsi_b2b-imx477.dtbo \
       freescale/${KERNEL_DEVICETREE_BASENAME}-dsicsi_b2b-imx708.dtbo \
       freescale/${KERNEL_DEVICETREE_BASENAME}-dsicsi_b2b-os08a20.dtbo \
       freescale/${KERNEL_DEVICETREE_BASENAME}-dsicsi_b2b-disp-7inch.dtbo \
       freescale/${KERNEL_DEVICETREE_BASENAME}-dsicsi_b2b-disp-5inch.dtbo \
       freescale/${KERNEL_DEVICETREE_BASENAME}-dsicsi_b2b-lt8912b.dtbo \
"

UBOOT_CONFIG_BASENAME = "imx95_19x19_evk"

IMXBOOT_TARGETS_BASENAME = "flash"

OEI_BOARD  = "mx95lp5"
DDR_TYPE   = "lpddr5"
DDR_FIRMWARE_NAME = " \
    lpddr5_dmem_v202409.bin \
    lpddr5_dmem_qb_v202409.bin \
    lpddr5_imem_v202409.bin \
    lpddr5_imem_qb_v202409.bin \
"

OEI_DDR_CONFIG     = "MIMX95_LPDDR5_EVK_19X19_6400MTS_FW2024.09_timing"
OEI_DDR_CONFIG_ECC = "MIMX95_LPDDR5_EVK_19X19_6400MTS_FW2024.09_ECC_enabled_timing"

M4_DEFAULT_IMAGE_MX95 = "m7_mcuboot_image.bin"

SYSTEM_MANAGER_CONFIG = "mr-navq95b"
SYSTEM_MANAGER_MONITOR_MODE = "0"
TARGET_NAME = "imx95-navqb"

# Use the open-source Mesa "panfrost" Gallium driver (kernel: panthor) as the
# sole GPU stack instead of ARM's proprietary mali-imx DDK blob. Mesa is built
# from source against the pinned glibc 2.39 (Ubuntu 24.04 ABI), whereas the
# mali-imx r54p1.6 blob requires GLIBC_2.43 and is therefore ABI-incompatible.
# Selecting only "mesa" makes mesa the provider for virtual/egl and
# virtual/libgles*, drops the proprietary blob, and keeps IMX_MALI_DUAL_DRIVER=0.
IMX_MALI_DRIVERS = "mesa"

KERNEL_MODULE_AUTOLOAD  += "mlan moal btnxpuart rpmsg_tty"
KERNEL_MODULE_PROBECONF += "moal"
module_conf_moal = "options moal fw_name=nxp/sduart_nw61x_v1.bin.se \
cal_data_cfg=none drv_mode=1 cfg80211_wext=0xf drvdbg=0x00000000" 
